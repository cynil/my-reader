name: 构建并部署到 GitHub Pages

# 加密发生在你本地（scripts/encrypt-books.mjs），仓库里只有密文；
# CI 只负责 npm run build + 发布，不再往仓库里写任何文件，
# 所以也不会再出现「CI 提交清单」和「本地提交清单」互相冲突的问题。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 校验数据文件已提交
        # 挡住「本地有密文、但没进 git」：.gitignore 里的 books/
        # 曾把 public/data/books/ 一起忽略，结果站点有封面、打开书却 404。
        run: |
          books=$(ls dist/data/books/*.bin 2>/dev/null | wc -l)
          covers=$(ls dist/data/covers/*.bin 2>/dev/null | wc -l)
          echo "密文书籍 $books 本，封面 $covers 个"
          if [ ! -f dist/data/key.json ] || [ ! -f dist/data/library.enc ]; then
            echo "::error::缺少 data/key.json 或 data/library.enc —— 先在本地跑 npm run encrypt，再提交 public/data"
            exit 1
          fi
          if [ "$books" -lt 1 ]; then
            echo "::error::dist/data/books 里没有密文。常见原因：public/data/books 被 .gitignore 误伤，或忘了 git add public/data"
            exit 1
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没启用 Pages 时，让 Action 自己把站点建出来
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布
        id: deploy
        uses: actions/deploy-pages@v4
