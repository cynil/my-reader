name: 构建并部署到 GitHub Pages

# 新版不再由 CI 生成清单：加密发生在你本地（scripts/encrypt-books.mjs），
# 仓库里只有密文，CI 只负责 npm run build + 发布。
# 副作用：再也不会出现「CI 提交清单」和「本地提交清单」互相冲突的问题。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read       # 只读，不需要再往仓库写东西
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没启用 Pages 时，让 Action 自己把站点建出来
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布
        id: deploy
        uses: actions/deploy-pages@v4
