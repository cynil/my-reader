name: 构建并部署到 GitHub Pages

# 加书只会改动 public/data/，前端产物完全不变。
# 所以这里按「代码指纹」缓存 dist：指纹没变就跳过 npm ci + vite build，
# 只把最新的书库数据塞进产物再发布。改代码时指纹变化，照常重新构建。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 计算代码指纹
        id: code
        run: |
          # 只对影响构建产物的文件取指纹；public/data 明确排除在外
          key=$(git ls-tree -r HEAD -- \
                  src index.html public/icon.svg \
                  package.json package-lock.json vite.config.js \
                | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "代码指纹 $key"

      - name: 复用上次的构建产物
        id: dist
        uses: actions/cache@v4
        with:
          path: dist
          # v2：v1 的缓存里混进了书库数据（cache 在 job 结束时才打包），换前缀重建
          key: dist-v2-${{ steps.code.outputs.key }}

      - name: 准备 Node
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖并构建
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build
          # 数据不放进缓存：它每次都要从 public/data 重新拷，
          # 否则缓存体积会随书库增长，恢复比构建还慢
          rm -rf dist/data

      - name: 跳过构建（代码未变化）
        if: steps.dist.outputs.cache-hit == 'true'
        run: echo "代码指纹未变，复用缓存产物，省掉 npm ci 与 vite build"

      - name: 注入书库数据
        run: |
          mkdir -p dist
          rm -rf dist/data
          cp -r public/data dist/data

      - name: 校验数据完整性
        run: |
          books=$(ls dist/data/books/*.bin 2>/dev/null | wc -l)
          covers=$(ls dist/data/covers/*.bin 2>/dev/null | wc -l)
          echo "密文书籍 $books 本，封面 $covers 个"
          if [ ! -f dist/data/key.json ] || [ ! -f dist/data/library.enc ]; then
            echo "::error::缺少 data/key.json 或 data/library.enc —— 先在本地跑 npm run add，再提交 public/data"
            exit 1
          fi
          if [ "$books" -lt 1 ]; then
            echo "::error::dist/data/books 里没有密文。常见原因：public/data/books 被 .gitignore 误伤，或忘了 git add public/data"
            exit 1
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没启用 Pages 时，让 Action 自己把站点建出来
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 清理产物再结束任务
        # actions/cache 在 job 结束时才打包 dist。此时 artifact 已经上传完毕，
        # 删掉 data 可以让缓存只保留代码产物（约 600 KB），不随书库体积增长。
        run: rm -rf dist/data

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布
        id: deploy
        uses: actions/deploy-pages@v4
